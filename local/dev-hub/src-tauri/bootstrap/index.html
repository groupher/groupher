<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Groupher Dev Hub</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body { color: #242424; background: #f2f1ee; font: 13px -apple-system, BlinkMacSystemFont, sans-serif; }
      .shell { display: flex; flex-direction: column; height: 100%; }
      .bar { display: flex; align-items: center; gap: 4px; min-height: 48px; padding: 5px 12px 5px 86px; overflow-x: auto; border-bottom: 1px solid #d7d7d2; }
      .tab { display: flex; align-items: center; flex: 0 0 auto; max-width: 260px; border-radius: 7px; }
      .tab[data-selected="true"] { background: #fff; box-shadow: 0 1px 3px #0002; }
      button { font: inherit; color: inherit; cursor: pointer; }
      .select { min-width: 0; border: 0; background: transparent; padding: 6px 7px 6px 10px; text-align: left; }
      .select strong, .select small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .select small { color: #676763; margin-top: 2px; }
      .close { border: 0; background: transparent; font-size: 17px; padding: 4px 8px; }
      button:focus-visible { outline: 2px solid #317b5e; outline-offset: 1px; }
      .content { flex: 1; min-height: 0; }
      .panel, iframe { width: 100%; height: 100%; border: 0; }
      .tab[hidden], .panel[hidden] { display: none; }
      .message { padding: 32px; white-space: pre-wrap; overflow-wrap: anywhere; }
      .path { font-size: 12px; color: #676763; padding: 5px 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-bottom: 1px solid #e1e1dc; }
      #error { color: #9b4038; padding: 6px 12px; }
      #error:empty { display: none; }
      @media (prefers-color-scheme: dark) {
        body { color: #eee; background: #202020; }
        .bar, .path { border-color: #404040; }
        .tab[data-selected="true"] { background: #383838; }
        .select small, .path { color: #bdbdb7; }
        #error { color: #efaaa3; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <nav class="bar" id="tabs" role="tablist" aria-label="Worktrees"></nav>
      <div class="path" id="path"></div>
      <div id="error" role="alert"></div>
      <main class="content" id="panels"><div class="message" id="empty" role="status">Run make dev from a checkout to open its Dev Hub.</div></main>
    </div>
    <script>
      const tabs = new Map()
      const closed = new Set()
      const tabList = document.querySelector('#tabs')
      const panels = document.querySelector('#panels')
      const pathLabel = document.querySelector('#path')
      const errorLabel = document.querySelector('#error')
      const empty = document.querySelector('#empty')
      let active = null

      function select(root) {
        if (!tabs.has(root) || closed.has(root)) return
        active = root
        for (const [key, item] of tabs) {
          const selected = key === root && !closed.has(key)
          item.tab.dataset.selected = String(selected)
          item.button.setAttribute('aria-selected', String(selected))
          item.button.tabIndex = selected ? 0 : -1
          item.panel.hidden = !selected
        }
        const item = tabs.get(root)
        pathLabel.textContent = `${item.data.root} · ${item.data.branch}`
        empty.hidden = true
      }

      function remove(root) {
        const item = tabs.get(root)
        if (!item) return
        closed.add(root)
        item.tab.hidden = true
        item.panel.hidden = true
        if (active === root) {
          active = null
          const next = [...tabs.keys()].find((key) => !closed.has(key))
          if (next) { select(next); tabs.get(next).button.focus() }
          else { pathLabel.textContent = ''; empty.hidden = false; tabList.tabIndex = -1; tabList.focus() }
        }
      }

      function update(data) {
        let item = tabs.get(data.root)
        if (!item) {
          const tab = document.createElement('div')
          tab.className = 'tab'
          tab.setAttribute('role', 'presentation')
          const button = document.createElement('button')
          button.className = 'select'
          button.type = 'button'
          button.setAttribute('role', 'tab')
          button.id = `tab-${tabs.size}`
          const name = document.createElement('strong')
          const branch = document.createElement('small')
          button.append(name, branch)
          button.addEventListener('click', () => select(data.root))
          button.addEventListener('keydown', (event) => {
            if (!['ArrowLeft', 'ArrowRight'].includes(event.key)) return
            const visible = [...tabs.keys()].filter((key) => !closed.has(key))
            const offset = event.key === 'ArrowRight' ? 1 : -1
            const next = visible[(visible.indexOf(data.root) + offset + visible.length) % visible.length]
            if (next) { event.preventDefault(); select(next); tabs.get(next).button.focus() }
          })
          const close = document.createElement('button')
          close.className = 'close'
          close.type = 'button'
          close.textContent = '×'
          close.setAttribute('aria-label', `Close ${data.name} tab`)
          close.addEventListener('click', () => remove(data.root))
          tab.append(button, close)
          const panel = document.createElement('section')
          panel.className = 'panel'
          panel.hidden = true
          panel.setAttribute('role', 'tabpanel')
          panel.id = `panel-${tabs.size}`
          button.setAttribute('aria-controls', panel.id)
          panel.setAttribute('aria-labelledby', button.id)
          tabList.append(tab)
          panels.append(panel)
          item = { tab, button, name, branch, panel, data: null, url: null }
          tabs.set(data.root, item)
        }
        item.data = data
        item.tab.hidden = closed.has(data.root)
        item.name.textContent = data.name
        item.branch.textContent = data.branch
        item.button.title = data.root
        if (data.status === 'ready' && data.url !== item.url) {
          const url = new URL(data.url)
          if (url.protocol !== 'http:' || url.hostname !== '127.0.0.1' || Number(url.port) < 4312 || Number(url.port) > 4339 || url.username || url.password || url.pathname !== '/' || url.searchParams.getAll('devhubRoot').length !== 1 || url.searchParams.get('devhubRoot') !== data.root || url.searchParams.getAll('devhubInstance').length !== 1 || !url.searchParams.get('devhubInstance')) throw new Error('Invalid Hub URL')
          const frame = document.createElement('iframe')
          frame.title = `Dev Hub: ${data.root}`
          frame.referrerPolicy = 'no-referrer'
          frame.src = url.href
          item.panel.replaceChildren(frame)
          item.url = data.url
        } else if (data.status !== 'ready') {
          const message = document.createElement('div')
          message.className = 'message'
          message.setAttribute('role', data.status === 'error' ? 'alert' : 'status')
          message.textContent = data.status === 'error' ? `${data.root}\n${data.error}\nRun make dev from this checkout to retry.` : `Starting ${data.root}…`
          item.panel.replaceChildren(message)
          item.url = null
        }
      }

      window.__DEV_HUB_DESKTOP__ = {
        sync(payload) {
          try {
            errorLabel.textContent = payload.error || ''
            for (const data of payload.tabs) update(data)
            if (payload.focus) { closed.delete(payload.focus); const item = tabs.get(payload.focus); if (item) item.tab.hidden = false; select(payload.focus) }
            else if (active && !closed.has(active)) select(active)
            else { const first = [...tabs.keys()].find((key) => !closed.has(key)); if (first) select(first) }
          } catch (error) { errorLabel.textContent = error instanceof Error ? error.message : String(error) }
        },
        error(message) { errorLabel.textContent = message },
      }
    </script>
  </body>
</html>
