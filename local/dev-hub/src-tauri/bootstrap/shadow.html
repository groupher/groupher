<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Groupher Dev Hub Shadow</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        pointer-events: none;
      }

      body {
        padding: 32px 32px 52px;
      }

      .shadow-caster {
        width: 100%;
        height: 100%;
        border-radius: 12px;
        box-shadow:
          0 0 0 0.5px rgba(0, 0, 0, 0.12),
          0 2px 6px -1px rgba(0, 0, 0, 0.16),
          0 10px 24px -4px rgba(0, 0, 0, 0.14),
          0 24px 56px -12px rgba(0, 0, 0, 0.2);
      }

      @media (prefers-color-scheme: dark) {
        .shadow-caster {
          box-shadow:
            0 0 0 0.5px rgba(255, 255, 255, 0.1),
            0 2px 6px -1px rgba(0, 0, 0, 0.32),
            0 10px 24px -4px rgba(0, 0, 0, 0.28),
            0 24px 56px -12px rgba(0, 0, 0, 0.4);
        }
      }
    </style>
  </head>
  <body>
    <div class="shadow-caster" aria-hidden="true"></div>
  </body>
</html>
