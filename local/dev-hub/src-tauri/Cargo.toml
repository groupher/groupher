[package]
name = "groupher-dev-hub"
version = "0.1.0"
description = "Desktop launcher for the local Groupher development hub"
authors = ["Groupher"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
