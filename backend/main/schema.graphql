  "paged subscribers of a community"
  pagedCommunitySubscribers(community: String!, filter: PagiFilter): PagedUsers

  "paged subscribers of a community"
  pagedCommunityModerators(community: String!, filter: PagiFilter): PagedUsers

  "get all categories"
  pagedCategories(filter: PagiFilter): PagedCategories

  "get community tag groups"
  communityTagGroups(community: String!, thread: Thread): [CommunityTagGroup]

  "get community tag stats by community, thread and slug"
  communityTagStats(community: String!, thread: Thread!, slug: String!): CommunityTagStat

  "got basic comments state"
  commentsState(article: ArticlePathInput!, freshkey: String): CommentsListState

  "got spec comment by ref"
  oneComment(comment: CommentPathInput!): Comment

  "get paged article comments"
  pagedComments(article: ArticlePathInput!, mode: CommentsMode, filter: CommentsFilter): PagedComments

  "get paged article comments participants"
  pagedCommentsParticipants(article: ArticlePathInput!, filter: PagiFilter): PagedUsers

  "get paged replies of a comment"
