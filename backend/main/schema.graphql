  "Built-in community Web Analysis summary"
  analysisWebSummary(community: String!, days: Int): AnalysisWebSummary

  "Public Umami website id for built-in community Analysis tracking"
  analysisTrackingWebsiteId(community: String!): String

  "Built-in community Analysis Trends summary and chart"
  analysisTrendsOverview(community: String!, days: Int): AnalysisTrendsOverview

  "One built-in community Analysis page dimension"
  analysisTrendPages(community: String!, days: Int, dimension: AnalysisTrendPagesDimension!): AnalysisTrendPagesSection

  "One built-in community Analysis source dimension"
  analysisTrendSources(community: String!, days: Int, dimension: AnalysisTrendSourcesDimension!): AnalysisTrendSourcesSection

  "One built-in community Analysis environment dimension"
  analysisTrendEnvironment(community: String!, days: Int, dimension: AnalysisTrendEnvironmentDimension!): AnalysisTrendEnvironmentSection

  "One built-in community Analysis location dimension"
  analysisTrendLocation(community: String!, days: Int, dimension: AnalysisTrendLocationDimension!): AnalysisTrendLocationSection

  "UTC weekly traffic cells for built-in community Analysis"
