  "Refresh a persisted Browser Session for canonical Auth only."
  refreshBrowserSession(browserSessionRef: String!): BrowserSigninResult

  "Revoke the current persisted Browser Session for canonical Auth only."
  revokeBrowserSession(browserSessionRef: String!): Done

  revokeBrowserSessionPublic(browserSessionRef: String!, publicRef: String!): Done

  revokeOtherBrowserSessions(browserSessionRef: String!): Done

  "Link an OAuth provider to the current account."
