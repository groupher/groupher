# fly.toml app configuration file generated for groupher-api on 2025-02-05T16:01:26+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
# groupher-api.fly.dev

app = 'groupher-api'
primary_region = 'sin'
kill_signal = 'SIGTERM'

[build]

[deploy]
release_command = '/app/bin/migrate'

[env]
  SEARCH_ARTIMENTS_ENABLED = 'false'
PHX_HOST = 'api.groupher.com'
PORT = '8080'
MIGRATION_EXPECTED_DATABASE = 'groupher_mentions_graph_20261106'

[[mounts]]
source = 'groupher_data'
destination = '/data'

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = 'off'
auto_start_machines = true
min_machines_running = 1
processes = ['app']

[[http_service.checks]]
grace_period = '10s'
interval = '15s'
method = 'GET'
path = '/health'
protocol = 'http'
timeout = '2s'

[http_service.concurrency]
type = 'connections'
hard_limit = 1000
soft_limit = 1000

[[vm]]
memory = '1gb'
cpu_kind = 'shared'
cpus = 1
