schema {
  mutation: RootMutationType
  query: RootQueryType
}

type RootQueryType {
  "List browser sessions for the account identified by the current session reference. Auth service only."
  browserSessions(browserSessionRef: String!, pagi: PagiInput): BrowserSessionPage!

  "List OAuth identities linked to the user represented by the delegated Auth request."
  linkedOauthAccounts: LinkedOauthAccounts!

  "List user profiles one page at a time."
  pagedUsers(filter: UserListFilter, pagi: PagiInput): UserPage!

  "Return the signed-in user's profile, or null for an anonymous request."
  me: User

  "Return the signed-in user's global Passport permissions."
  currentGlobalPassport: GlobalPassport!

  "Look up a user's profile by login."
  user(login: String!): User

  "Return the request's authentication state and the signed-in user, if any."
  sessionState: SessionState

  "List communities the specified user subscribes to."
  subscribedCommunities(login: String!, filter: UserListFilter, pagi: PagiInput): CommunityPage

  "Suggest a limited set of communities for discovery, including Home when visible."
  defaultCommunitySuggestions: [Community!]!

  "List the viewer's mailbox mentions by read state; defaults to unread."
  pagedMentions(pagi: PagiInput, filter: MailboxMentionsFilter): PagedMailboxMentions

  "List the viewer's mailbox notifications by read state; defaults to unread."
  pagedNotifications(pagi: PagiInput, filter: MailboxNotificationsFilter): PagedMailboxNotifications

  "List accounts that follow the specified user."
  pagedFollowers(login: String!, filter: UserListFilter, pagi: PagiInput): UserPage

  "List accounts the specified user follows."
  pagedFollowings(login: String!, filter: UserListFilter, pagi: PagiInput): UserPage

  "List articles upvoted by the specified user."
  pagedUpvotedArticles(login: String!, pagi: PagiInput, filter: ArticleCollectionFilter): ArticleCollectionPage

  "List the specified user's collection folders visible to the viewer."
  pagedCollectFolders(login: String!, pagi: PagiInput, filter: ArticleCollectionFilter): CollectFolderPage

  "List articles in the specified collection folder."
  pagedCollectedArticles(folderId: ID!, pagi: PagiInput, filter: ArticleCollectionFilter): ArticleCollectionPage

  "paged communities which the user it's the editor"
  administeredCommunities(login: String, pagi: PagiInput): CommunityPage

  "Find up to 15 users whose login or nickname matches the search text."
  searchUsers(name: String!): [CommonUser!]!

  "List comments published by the specified user, optionally restricted to a thread."
  pagedPublishedComments(login: String!, filter: CommentPageFilter, pagi: PagiInput, thread: Thread): CommentCollectionPage

  "List posts published by the user with the given login."
  pagedPublishedPosts(
    "Login of the author whose publications to list."
    login: String!

    "Filters and ordering for the article list."
    filter: ArticlePageFilter

    "Pagination parameters for this list."
    pagi: PagiInput

    "Article thread selected by this query."
    thread: PostThread
  ): PostPage

  "List blogs published by the user with the given login."
  pagedPublishedBlogs(
    "Login of the author whose publications to list."
    login: String!

    "Filters and ordering for the article list."
    filter: ArticlePageFilter

    "Pagination parameters for this list."
    pagi: PagiInput

    "Article thread selected by this query."
    thread: BlogThread
  ): BlogPage

  "List changelogs published by the user with the given login."
  pagedPublishedChangelogs(
    "Login of the author whose publications to list."
    login: String!

    "Filters and ordering for the article list."
    filter: ArticlePageFilter

    "Pagination parameters for this list."
    pagi: PagiInput

    "Article thread selected by this query."
    thread: ChangelogThread
  ): ChangelogPage

  "List docs published by the user with the given login."
  pagedPublishedDocs(
    "Login of the author whose publications to list."
    login: String!

    "Filters and ordering for the article list."
    filter: ArticlePageFilter

    "Pagination parameters for this list."
    pagi: PagiInput

    "Article thread selected by this query."
    thread: DocThread
  ): DocPage

  "Admin candidates excluding current members and pending requests"
  adminCandidates(communityRef: String!, name: String!): [CommonUser!]!

  "Paged Community Admin memberships"
  pagedCommunityAdmins(communityRef: String!, pagi: PagiInput): CommunityAdminPage!

  "Paged public Admin identities for a readable Community"
  pagedCommunityAdminMembers(communityRef: String!, filter: UserListFilter, pagi: PagiInput): CommunityAdminDirectoryPage!

  "Paged Admin requests visible to the current user"
  pagedCommunityAdminRequests(communityRef: String!, pagi: PagiInput): CommunityAdminRequestPage!

  "Current viewer's Admin membership in a Community"
  currentCommunityAdmin(communityRef: String!): CommunityAdmin

  "Whether the viewer can manage Community Admin memberships"
  communityAdminManagementAllowed(communityRef: String!): Boolean!

  "Paged current co-authors for one Article; requires article.author.manage"
  pagedArticleCoAuthors(articleId: ID!, pagi: PagiInput): ArticleCoAuthorPage!

  "Search bounded Article co-author invite candidates; requires article.author.manage"
  articleCoAuthorCandidates(articleId: ID!, name: String!): [CommonUser!]!

  "Paged Article co-author requests visible to the manager or current subject"
  pagedArticleCoAuthorRequests(articleId: ID!, pagi: PagiInput): ArticleCoAuthorRequestPage!

  "The current viewer's effective permissions for one Article"
  articlePermissions(articleId: ID!): ArticlePermissions!

  "Paged ordinary Article Trash for one Community Binding"
  communityArticleTrashItems(communityRef: String!, thread: CommunityArticleTrashThread!, pagi: PagiInput): CommunityArticleTrashPage!

  "One ordinary Article Trash record for a Community Binding"
  communityArticleTrash(communityRef: String!, thread: CommunityArticleTrashThread!, id: ID!): CommunityArticleTrashItem

  "Read the approval policy for the community Docs queue."
  docsQueuePolicy(community: String!): Json

  "Preview the changes in the current Docs release queue."
  docsQueuePreview(community: String!, articleId: ID, versions: Json): Json

  "Compare Docs changes against the selected publication or approval baseline."
  docsApprovalDiff(community: String!, articleId: ID, versions: Json, baseline: DocsDiffBaseline): Json

  "List previous Docs releases for the community."
  docsReleaseHistory(community: String!, beforeId: Int, limit: Int): Json

  "Read one Docs release by its release ID."
  docsReleaseDetail(community: String!, releaseId: Int!, articleId: ID): Json

  "List saved snapshots for the specified Doc."
  docsSnapshotHistory(community: String!, articleId: ID!, snapshotId: ID, cursor: Json): Json

  "List publication notices for the community."
  docsPublicationNotices(community: String!): Json

  "Read the current post-publication conflict for an editable Doc"
  docsPostPublishConflict(community: String!, articleId: ID!): DocsPostPublishConflict

  "Editable WorkingCopies for one Article"
  articleWorkingCopies(articleId: ID!, community: String!): [ArticleWorkingCopy!]!

  "Immutable Snapshots for one Article"
  articleSnapshots(articleId: ID!, community: String!): [ArticleSnapshot!]!

  "One immutable Snapshot for an Article editor"
  articleSnapshot(articleId: ID!, snapshotId: ID!, community: String!): ArticleSnapshot

  "Paged immutable editing and publication events for one Article"
  pagedArticleEvents(articleId: ID!, pagi: Json, type: ArticleEventType, actorId: ID): Json!

  "One immutable Article event and its before\/after Diff"
  articleEvent(articleId: ID!, eventId: ID!, pagi: Json): Json

  "Compares explicit saved Article versions"
  articleDiff(articleId: ID!, before: ArticleVersionRefInput!, after: ArticleVersionRefInput!): Json

  "Safe product ArticleLog for one readable Article"
  articleLogs(article: ArticlePathInput!, pagi: PagiInput): ArticleLogPage!

  "Hourly business metrics for one readable Article"
  articleInsights(
    article: ArticlePathInput!, from: DateTime, to: DateTime, metrics: [ArticleInsightsMetric!], actorTypes: [ArticleInsightsActorType!], isAuthenticated: Boolean
  ): ArticleInsightsTrend!

  "Current public Article headline stats for one Community\/thread batch"
  articleStats(community: String!, thread: Thread!, innerIds: [ID!]!): [ArticleStats!]!

  "Safe Community Activity timeline across readable resource streams"
  communityActivity(community: String!, selection: CommunityActivitySelectionInput!, pagi: PagiInput): CommunityActivityPage!

  "UTC daily Community Activity counts for the timeline overview"
  communityActivityStats(community: String!, selection: CommunityActivitySelectionInput!): CommunityActivityStats!

  "Active Community Activity actions available to the current manager"
  communityActivityConfig(community: String!): CommunityActivityConfig!

  "Reads one safe Community Activity event by event reference"
  communityActivityEvent(community: String!, eventRef: ID!): CommunityActivityEvent

  "Current user's Apply admission state and blocking application"
  communityApplicationState: CommunityApplicationState!

  "One Community Application owned by the current user"
  communityApplication(ref: ID!): CommunityApplication

  "Reviewer-scoped detail for any Community Application"
  reviewCommunityApplication(ref: ID!): CommunityApplication

  "Reviewer-scoped Community Application queue"
  pagedCommunityApplications(filter: CommunityApplicationsFilter!, pagi: PagiInput): CommunityApplicationPage!

  "Server-trusted origin metadata for an Application Logo"
  communityApplicationLogoOriginInfo(publicRef: ID!): ApplicationLogoOriginInfo

  "Current Article Trash memberships"
  trashedArticles(community: String!, thread: Thread!, pagi: PagiInput, filter: TrashFilter): TrashPage

  "One current Article Trash membership"
  trashedArticle(id: ID!, community: String!, thread: Thread!): TrashedArticle

  "Built-in community Web Analysis summary"
  analysisWebSummary(community: String!, days: Int): AnalysisWebSummary

  "Public Umami website id for built-in community Analysis tracking"
  analysisTrackingWebsiteId(community: String!): String

  "Public visitor distribution for an enabled community About page"
  analysisVisitorLocationMap(community: String!): AnalysisVisitorLocationMap

  "Built-in community Analysis Trends summary and chart"
  analysisTrendsOverview(community: String!, days: Int): AnalysisTrendsOverview

  "Current active visitors for the built-in community Analysis"
  analysisActiveVisitors(community: String!): AnalysisWebActive

  "One built-in community Analysis page dimension"
  analysisTrendPages(community: String!, days: Int, dimension: AnalysisTrendPagesDimension!): AnalysisTrendPagesSection

  "One built-in community Analysis source dimension"
  analysisTrendSources(community: String!, days: Int, dimension: AnalysisTrendSourcesDimension!): AnalysisTrendSourcesSection

  "One built-in community Analysis environment dimension"
  analysisTrendEnvironment(community: String!, days: Int, dimension: AnalysisTrendEnvironmentDimension!): AnalysisTrendEnvironmentSection

  "One built-in community Analysis location dimension"
  analysisTrendLocation(community: String!, days: Int, dimension: AnalysisTrendLocationDimension!): AnalysisTrendLocationSection

  "UTC weekly traffic cells for built-in community Analysis"
  analysisTrendTraffic(community: String!, days: Int): AnalysisTrendTrafficSection

  "dashboard theme preset registry"
  themePresets: [DsbThemePresetOption!]!

  "dashboard third-party analytics provider registry"
  thirdPartyAnalyticsProviders: [DsbThirdPartyAnalyticsProvider!]!

  "Read a Doc's editable copy and current public snapshot."
  docsEditor(community: String!, articleId: ID!): DocsEditor

  "Read the editable Docs navigation tree and its revisions."
  docsWorkspaceTree(community: String!): DocsWorkspaceTree

  "public community docs side tree"
  docPublicTree(community: String!): DocPublicTree

  "Current authorized Docs publication queue"
  docsPublishQueue(community: String!): DocsPublishQueue

  "One Article's existing Queue member editor source"
  docsQueueMember(community: String!, articleId: ID!): DocsQueueMemberEditor

  "Check whether removing Docs from the Queue discards unique edits"
  docsDequeuePreview(community: String!, queueRevision: Int!, articleIds: [ID!]!): DocsDequeuePreview

  "Preview a workspace deletion and any Queue-only edits it would discard"
  docsWorkspaceDeletePreview(community: String!, treeRevision: Int!, queueRevision: Int!, nodeId: ID!): DocsWorkspaceDeletePreview

  "public community docs cover"
  docCover(community: String!, view: DocCoverView): DocCover

  "Look up a community by slug."
  community(slug: String!, incViews: Boolean): Community

  "paged assets owned by a community"
  pagedCommunityAssets(community: String!, filter: CommunityAssetFilter, pagi: PagiInput): CommunityAssetPage

  "community asset filter stats and storage quota"
  communityAssetStats(community: String!, filter: CommunityAssetFilter): CommunityAssetStats

  "community asset storage usage"
  communityAssetUsage(community: String!): CommunityAssetUsage

  "paged article references for one community asset"
  communityAssetRefs(community: String!, assetId: ID!, pagi: PagiInput): ArticleAssetRefPage

  "service-scoped public-read origin metadata for one community asset"
  communityAssetOriginInfo(publicRef: String!): CommunityAssetOriginInfo

  "Service-scoped check for a successfully published Wallpaper Batch"
  wallpaperBatchPublished(batchRef: String!): Boolean!

  "Check whether a community name is available."
  checkCommunityName(slug: String!): CommunityNameCheck

  "communities with pagination info"
  pagedCommunities(filter: CommunitiesFilter, pagi: PagiInput): CommunityPage

  "paged subscribers of a community"
  pagedCommunitySubscribers(community: String!, filter: UserListFilter, pagi: PagiInput): UserPage

  "get all categories"
  categories: [Category!]!

  "get community tag groups"
  communityTagGroups(community: String!, thread: Thread): [CommunityTagGroup]

  "get community tag stats by community, thread and slug"
  communityTagStats(community: String!, thread: Thread!, slug: String!): CommunityTagStat

  "Read comment and participant counts for one article."
  commentsState(article: ArticlePathInput!, freshkey: String): CommentsListState

  "Reads current viewer state for up to 100 canonical Article paths; anonymous requests return an empty list"
  articleViewerStates(paths: [ArticlePathInput!]!): [ViewerArticleState!]!

  "Reads the current private Article interaction projection for confirmed-write reconciliation"
  articleInteractionStates(paths: [ArticlePathInput!]!): [ArticleInteractionState!]!

  "Reads current viewer state for up to 100 canonical Comment references; anonymous requests return an empty list"
  commentViewerStates(article: ArticlePathInput!, commentInnerIds: [ID!]!): [ViewerCommentState!]!

  "Reads up to 100 Comment projections for confirmed-write reconciliation in one request"
  commentReconcileStates(article: ArticlePathInput!, commentInnerIds: [ID!]!): CommentReconcilePayload!

  "Read one comment by its article path and local comment number."
  oneComment(comment: CommentPathInput!): Comment

  "Reads one Comment reached through a stored Mention, even when its parent body is restricted"
  mentionedComment(community: String!, locator: MentionsGraphLocatorInput!): Comment

  "Comment Lite page using the shared offset\/cursor pagination contract"
  commentPage(article: ArticlePathInput!, mode: CommentsMode, filter: CommentPageFilter, pagi: PagiInput): CommentPage!

  "get paged article comments participants"
  pagedCommentsParticipants(article: ArticlePathInput!, pagi: PagiInput): UserPage

  "A root comment's flat descendants through the shared Pagi contract"
  commentReplyPage(comment: CommentPathInput!, filter: CommentPageFilter, pagi: PagiInput): CommentReplyPage!

  "mentions created by an artiment"
  mentions(community: String!, source: MentionsGraphLocatorInput!, pagi: PagiInput): ArtimentMentionPage

  "artiments mentioning an internal target"
  mentionedBy(community: String!, target: MentionTargetInput!, pagi: PagiInput): ArtimentMentionPage

  "Pages mention relationships around a focused resource in a community."
  mentionsGraph(community: String!, focus: MentionsGraphLocatorInput!, after: String, first: Int): MentionsGraphPage!

  "Reads Artiment title, URL and body status by stable resource identity"
  artimentStatus(community: String!, locator: ArtimentStatusInput!): ArtimentStatus

  "Reads the revision of the mention graph around a focused resource."
  mentionsGraphRevision(community: String!, focus: MentionsGraphLocatorInput!): ID!

  "Pages article comments associated with a focused mention graph resource."
  mentionsGraphArticleComments(community: String!, focus: MentionsGraphLocatorInput!, after: ID, first: Int): MentionsGraphArticleCommentsPage!

  "search communities by title"
  searchCommunities(title: String!, category: String): [Community!]!

  "Public User Ticket Kanban columns"
  ticketKanban(community: String!, pagi: PagiInput): TicketKanbanColumns!

  "Internal User Ticket Kanban columns"
  ticketKanbanInternal(community: String!, filter: TicketFilter, pagi: PagiInput): TicketKanbanColumns!

  "One public User Ticket page"
  ticketPage(community: String!, filter: TicketFilter, pagi: PagiInput): TicketPage!

  "One internal User Ticket page"
  ticketPageInternal(community: String!, filter: TicketFilter, pagi: PagiInput): TicketPage!

  "One public User Ticket by Community-shared number"
  ticket(community: String!, innerId: Int!): Ticket

  "One internal User, Worker or Case Ticket"
  ticketInternal(community: String!, id: ID!): Ticket

  "Internally visible User Tickets linked to one Post"
  postTicketLinksInternal(community: String!, postId: ID!): [Ticket!]!

  "Internal Ticket title prefix search"
  ticketSearch(community: String!, query: String!, type: TicketTypeEnum, pagi: PagiInput): TicketPage!

  "Batched public Ticket progress for a Post page"
  postTicketProgress(community: String!, postInnerIds: [Int!]!): [PostTicketProgress!]!

  "get open graph info by url"
  openGraphInfo(url: String!): OpenGraph

  "Article Lite page using the shared offset\/cursor pagination contract"
  postPage(pagi: PagiInput, filter: PostFilter, thread: PostThread): PostPage!

  "Changelog Lite page using the shared offset\/cursor pagination contract"
  changelogPage(pagi: PagiInput, filter: ChangelogFilter, thread: ChangelogThread): ChangelogPage!

  "Blog Lite page using the shared pagination contract"
  blogPage(pagi: PagiInput, filter: ArticlePageFilter, thread: BlogThread): BlogPage!

  "Doc Lite page using the shared pagination contract"
  docPage(pagi: PagiInput, filter: ArticlePageFilter, thread: DocThread): DocPage!

  "Search Article and Comment content through the unified Artiment index"
  searchArtiments(query: SearchArtimentsQueryInput!, pagi: PagiInput): SearchArtimentPage!

  "List users who have upvoted the article."
  upvotedUsers(
    "Community, thread and local ID of the article."
    article: ArticlePathInput!

    "Pagination parameters for this list."
    pagi: PagiInput
  ): UserPage

  "List users who have collected the article."
  collectedUsers(
    "Community, thread and local ID of the article."
    article: ArticlePathInput!

    "Pagination parameters for this list."
    pagi: PagiInput
  ): UserPage

  "Read a post by its community, thread and local ID."
  post(
    "Community, thread and local ID of the article."
    article: ArticlePathInput!
  ): Post!

  "Read a blog by its community, thread and local ID."
  blog(
    "Community, thread and local ID of the article."
    article: ArticlePathInput!
  ): Blog!

  "Read a changelog by its community, thread and local ID."
  changelog(
    "Community, thread and local ID of the article."
    article: ArticlePathInput!
  ): Changelog!

  "Read a doc by its community, thread and local ID."
  doc(
    "Community, thread and local ID of the article."
    article: ArticlePathInput!
  ): Doc!

  "Lists pending content reviews in a review scope."
  pendingArtimentReviews(scope: ReviewBotScopeInput!, limit: Int, offset: Int): [CmsArtimentReview!]!

  "Loads the current review for a content target."
  artimentReview(target: ArtimentReviewTargetInput!): CmsArtimentReview

  "Loads the review notice for a content target."
  artimentReviewNotice(target: ArtimentReviewTargetInput!): ArtimentReviewNotice

  "Lists past reviews for a content target."
  artimentReviewHistory(target: ArtimentReviewTargetInput!, limit: Int, offset: Int): [CmsArtimentReview!]!

  "Loads the Press configuration for a community."
  pressConfig(community: String!): PressConfig

  "Loads an article for the Press service."
  pressArticle(article: ArticlePathInput!): PressArticle

  "Loads a community RSS feed for the Press service."
  pressCommunityRssFeed(community: String!, input: PressCommunityRSSFeedInput!): PressCommunityRSSFeed

  "Loads a thread RSS feed for the Press service."
  pressThreadRssFeed(community: String!, thread: Thread!, input: PressThreadRSSFeedInput!): PressThreadRSSFeed

  "Loads a community site manifest for the Press service."
  pressSiteManifest(community: String!): PressSiteManifest

  "checks whether the current user can import Docs into this Community"
  canImportDocs(community: String!): Boolean!

  "plan a bounded SourceTree against the current Docs target without creating a Job"
  previewDocImportTarget(community: String!, sourceInfo: ImportSourcePreviewInput!, tree: Json!): ImportTargetPreview!

  "read one community-scoped Import Job and its safe Doc preview"
  importJob(community: String!, jobRef: ID!): ImportJob

  "Lists reports submitted by the current user."
  myReports(filter: AlertReportFilter, pagi: PagiInput): AlertReportPage!

  "Lists alert items in the requested review scope."
  alertItems(scope: ReviewBotScopeInput!, filter: AlertItemFilter, pagi: PagiInput): AlertItemPage!

  "Loads an alert item by its ID."
  alertItem(id: ID!): AlertItem

  "Lists reports associated with an alert item."
  alertItemReports(id: ID!, pagi: PagiInput): AlertReportPage!

  "Loads ReviewBot policy for a scope and subject type."
  reviewBotConfig(scope: ReviewBotScopeInput!, subjectType: ReviewBotSubjectType!): ReviewBotConfig!
}

type RootMutationType {
  "Exchange an acceptance credential for a browser session through the Auth service."
  redeemProductionSeedLogin(credential: String!, browserSession: BrowserSessionMetadataInput): BrowserSigninResult

  "Evaluate a public profile visit and return whether it counted and the resulting view total."
  trackProfileView(login: String!): ProfileViewTrackResult!

  "Update the signed-in user's profile and optional social details."
  updateProfile(profile: UserProfileInput!, social: SocialInput): User

  "Sign in through the Auth service with an OAuth identity and return browser session credentials."
  signinOauth(provider: OauthProviderInput!, browserSession: BrowserSessionMetadataInput): BrowserSigninResult

  "Issue a fresh access token for an active browser session through the Auth service."
  refreshBrowserSession(browserSessionRef: String!): BrowserSigninResult

  "Revoke the browser session identified by its Auth service session reference."
  revokeBrowserSession(browserSessionRef: String!): Done

  "Revoke another session on the same account by its public reference."
  revokeBrowserSessionPublic(browserSessionRef: String!, publicRef: String!): Done

  "Revoke the account's other browser sessions and keep the current session."
  revokeOtherBrowserSessions(browserSessionRef: String!): Done

  "Link a verified provider identity to the signed-in user and return the updated bindings."
  linkOauthIdentity(identity: VerifiedOauthIdentityInput!): LinkedOauthAccounts!

  "Remove the specified OAuth binding and return the remaining bindings."
  unlinkOauthIdentity(publicRef: ID!): LinkedOauthAccounts!

  "Follow the user identified by login."
  follow(login: String!): User

  "Stop following the user identified by login."
  undoFollow(login: String!): User

  "Create a collection folder for the signed-in user."
  createCollectFolder(title: String!, private: Boolean, desc: String): CollectFolder

  "Change a collection folder's title, description, or privacy setting."
  updateCollectFolder(id: ID!, title: String, private: Boolean, desc: String): CollectFolder

  "Delete the collection folder identified by its ID."
  deleteCollectFolder(id: ID!): CollectFolder

  "Add the specified article to a collection folder and return the collection result."
  addToCollect(article: ArticlePathInput!, folderId: ID!, commandId: ID!): ArticleCollectResult

  "Remove the specified article from a collection folder and return the collection result."
  removeFromCollect(article: ArticlePathInput!, folderId: ID!, commandId: ID!): ArticleCollectResult

  "Mark the selected mentions or notifications in the viewer's mailbox as read."
  markRead(ids: [ID], type: MailboxType): Done

  "Mark all messages of the selected type in the viewer's mailbox as read."
  markReadAll(type: MailboxType): Done

  "Create an Application-scoped Community Logo upload intent"
  createCommunityApplicationLogoUploadIntent(input: ApplicationLogoUploadInput!): ApplicationLogoUploadIntent!

  "Complete an Application Logo upload from Assets Hub"
  completeCommunityApplicationLogoUpload(input: CommunityApplicationLogoCompletionInput!): ApplicationLogoUploadCompletion!

  "Submit a new Community Application"
  submitCommunityApplication(input: CommunityApplicationInput!, commandId: ID!): CommunityApplication!

  "Cancel an owned Community Application"
  cancelCommunityApplication(ref: ID!, expectedVersion: Int!, commandId: ID!): CommunityApplication!

  "Move a submitted Application into review"
  startCommunityApplicationReview(ref: ID!, expectedVersion: Int!, commandId: ID!): CommunityApplication!

  "Approve a reviewed Community Application"
  approveCommunityApplication(ref: ID!, expectedVersion: Int!, commandId: ID!, note: String): CommunityApplication!

  "Reject a reviewed Community Application"
  rejectCommunityApplication(ref: ID!, expectedVersion: Int!, commandId: ID!, reasonCode: String!, note: String): CommunityApplication!

  "Retry Community identity creation for a failed Application"
  retryCommunityCreation(ref: ID!, expectedVersion: Int!, commandId: ID!): CommunityApplication!

  "Retry Community setup for a failed Application"
  retryCommunitySetup(ref: ID!, expectedVersion: Int!, commandId: ID!): CommunityApplication!

  "create a global community"
  createCommunity(commandId: ID!, title: String!, desc: String!, slug: String!, logo: String!, locale: String): Community

  "update a community"
  updateCommunity(
    community: String!, commandId: ID!, title: String, desc: String, slug: String, logo: String, locale: String
  ): Community

  "delete a global community"
  requestDestroyCommunity(community: String!, commandId: ID!): Community

  "register an uploaded asset into the community asset library"
  registerCommunityAsset(community: String!, asset: CommunityAssetInput!, commandId: ID!): CommunityAsset

  "create a short-lived assets-hub upload intent"
  createCommunityAssetUploadIntent(community: String!, file: CommunityAssetUploadFileInput!): CommunityAssetUploadIntent

  "complete a verified assets-hub upload"
  completeCommunityAssetUpload(input: CommunityAssetUploadCompletionInput!): CommunityAsset

  "delete an unreferenced community asset from the asset library"
  deleteCommunityAsset(community: String!, id: ID!, commandId: ID!): CommunityAsset

  "create category"
  createCategory(commandId: ID!, community: String!, title: String!, slug: String!): Category

  "delete category"
  deleteCategory(commandId: ID!, community: String!, id: ID!): Category

  "update category"
  updateCategory(commandId: ID!, community: String!, id: ID!, title: String!): Category

  "create a tag"
  createCommunityTag(
    commandId: ID!, title: String!, slug: String!, color: RainbowColor!, layout: String, community: String!, groupId: ID!, thread: Thread, extra: [String], marker: MarkerInput
  ): CommunityTag

  "update a tag"
  updateCommunityTag(
    commandId: ID!, id: ID!, community: String!, title: String, layout: String, desc: String, slug: String, color: RainbowColor, groupId: ID, thread: Thread, extra: [String], marker: MarkerInput
  ): CommunityTag

  "create a tag group"
  createCommunityTagGroup(commandId: ID!, title: String!, community: String!, thread: Thread): CommunityTagGroup

  "update a tag group"
  updateCommunityTagGroup(commandId: ID!, id: ID!, community: String!, title: String!, thread: Thread): CommunityTagGroup

  "delete a tag group"
  deleteCommunityTagGroup(commandId: ID!, id: ID!, community: String!, thread: Thread): CommunityTagGroup

  "delete a tag by thread"
  deleteCommunityTag(commandId: ID!, id: ID!, community: String!, thread: Thread): CommunityTag

  "Create an Admin invitation or submit the current user's application"
  createCommunityAdminRequest(
    communityRef: String!, type: String!, subjectLogin: String, permissions: Json!, commandId: ID!
  ): CommunityAdminRequest!

  "Accept or reject an Admin invitation or application"
  decideCommunityAdminRequest(
    requestId: ID!, revision: Int!, decision: String!, approvedPermissions: Json, commandId: ID!
  ): CommunityAdminRequest!

  "Cancel an Admin request at its current revision"
  cancelCommunityAdminRequest(requestId: ID!, revision: Int!, commandId: ID!): CommunityAdminRequest!

  "Replace one Admin's grantable permissions at its current revision"
  updateCommunityAdminPermissions(
    communityRef: String!, memberId: ID!, revision: Int!, permissions: Json!, commandId: ID!
  ): CommunityAdmin!

