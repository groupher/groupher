app = 'groupher-press'
primary_region = 'sin'
kill_signal = 'SIGTERM'

[deploy]
  release_command = '/app/node_modules/.bin/drizzle-kit migrate --config drizzle.config.ts'

[env]
  HOST = '0.0.0.0'
  PORT = '8003'
  PHOENIX_GRAPHQL_ENDPOINT = 'https://api.groupher.com/graphiql'

[http_service]
  internal_port = 8003
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[http_service.checks]]
  grace_period = '10s'
  interval = '15s'
  method = 'GET'
  path = '/health'
  protocol = 'http'
  timeout = '2s'

[http_service.concurrency]
  type = 'connections'
  hard_limit = 200
  soft_limit = 150

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
