packages:
  - 'backend/*'
  - 'infra/*'
  - 'frontend/*'
  - 'local/*'
  - 'packages/*'

# Use pnpm's native symlinked virtual-store layout so each workspace resolves
# only its declared dependencies.
nodeLinker: isolated
injectWorkspacePackages: true
strictDepBuilds: true

# pnpm 12 is provisioned explicitly by pnpm/setup, Docker, and local setup
# instructions. Do not persist pnpm's own bootstrap packages in the project lockfile.
pmOnFail: ignore

# Keep shared TanStack runtime packages singular across every workspace and
# override transitive ranges that would otherwise resolve independently.
overrides:
  '@tanstack/query-core': 5.104.0
  '@tanstack/react-query': 5.104.0
  '@tanstack/router-ssr-query-core': 1.169.3

# Only Lefthook needs its install script in the current repository. Keep every
# other observed build-script decision explicit so clean frozen installs are
# reproducible and do not silently execute new dependency scripts.
allowBuilds:
  '@swc/core': false
  '@vgpu/adapter-node': true
  cbor-extract: false
  esbuild: false
  lefthook: true
  tsparticles-engine: false
  webgpu: true
  workerd: false
minimumReleaseAgeExclude:
  # Native toolchain artifacts and reviewed Cloudflare prereleases are pinned
  # exactly; see docs/deploy/cloudflare.md for the beta decision and rollback.
  - '@oxfmt/binding-android-arm-eabi@0.71.0'
  - '@oxfmt/binding-android-arm64@0.71.0'
  - '@oxfmt/binding-darwin-arm64@0.71.0'
  - '@oxfmt/binding-darwin-x64@0.71.0'
  - '@oxfmt/binding-freebsd-x64@0.71.0'
  - '@oxfmt/binding-linux-arm-gnueabihf@0.71.0'
  - '@oxfmt/binding-linux-arm-musleabihf@0.71.0'
  - '@oxfmt/binding-linux-arm64-gnu@0.71.0'
  - '@oxfmt/binding-linux-arm64-musl@0.71.0'
  - '@oxfmt/binding-linux-ppc64-gnu@0.71.0'
  - '@oxfmt/binding-linux-riscv64-gnu@0.71.0'
  - '@oxfmt/binding-linux-riscv64-musl@0.71.0'
  - '@oxfmt/binding-linux-s390x-gnu@0.71.0'
  - '@oxfmt/binding-linux-x64-gnu@0.71.0'
  - '@oxfmt/binding-linux-x64-musl@0.71.0'
  - '@oxfmt/binding-openharmony-arm64@0.71.0'
  - '@oxfmt/binding-win32-arm64-msvc@0.71.0'
  - '@oxfmt/binding-win32-ia32-msvc@0.71.0'
  - '@oxfmt/binding-win32-x64-msvc@0.71.0'
  - '@oxlint/binding-android-arm-eabi@1.86.0'
