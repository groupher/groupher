web:
  address: 0.0.0.0
  port: 8080

ui:
  title: Groupher Status
  header: Groupher Status
  dashboard-heading: Groupher services
  dashboard-subheading: Current availability of Groupher product capabilities
  description: Groupher public service status
  dark-mode: true
  default-sort-by: group
  buttons:
    - name: Groupher
      link: https://groupher.com/

storage:
  type: sqlite
  path: /data/gatus.db

# The webhook is injected with `fly secrets set`. Until it is configured,
# Gatus keeps monitoring and simply skips Discord delivery.
alerting:
  discord:
    webhook-url: "${GATUS_DISCORD_WEBHOOK_URL}"

endpoints:
  - name: Public Edge Router
    group: Core services
    url: https://groupher.com/health
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].schemaVersion == health.v1"
      - "[BODY].service == edge-router"
      - "[BODY].status == ok"
      - "[RESPONSE_TIME] < 15000"
    ui:
      hide-url: true
      hide-hostname: true
      hide-port: true
      hide-conditions: true
      hide-errors: true
    alerts:
      - type: discord
        enabled: true
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: true

  - name: API
    group: Core services
    url: https://api.groupher.com/health
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].schemaVersion == health.v1"
      - "[BODY].service == phoenix"
      - "[BODY].status == ok"
      - "[RESPONSE_TIME] < 15000"
    ui:
      hide-url: true
      hide-hostname: true
      hide-port: true
      hide-conditions: true
      hide-errors: true
    alerts:
      - type: discord
        enabled: true
        failure-threshold: 3
