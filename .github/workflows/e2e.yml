name: e2e

on:
  pull_request:
    paths:
      - 'frontend/main/**'
      - 'frontend/dashboard/**'
      - 'frontend/dash/**'
      - 'frontend/landing/**'
      - 'frontend/core/**'
      - 'frontend/mock-server/**'
      - 'frontend/e2e/**'
      - 'backend/auth/**'
      - 'packages/contracts/**'
      - 'packages/service/**'
      - 'package.json'
      - 'yarn.lock'
      - '!frontend/**/vercel.json'
  push:
    paths:
      - 'frontend/main/**'
      - 'frontend/dashboard/**'
      - 'frontend/dash/**'
      - 'frontend/landing/**'
      - 'frontend/core/**'
      - 'frontend/mock-server/**'
      - 'frontend/e2e/**'
      - 'backend/auth/**'
      - 'packages/contracts/**'
      - 'packages/service/**'
      - 'package.json'
      - 'yarn.lock'
      - '!frontend/**/vercel.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      main: ${{ steps.filter.outputs.main }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      dash: ${{ steps.filter.outputs.dash }}
      landing: ${{ steps.filter.outputs.landing }}
      auth: ${{ steps.filter.outputs.auth }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            main:
              - 'frontend/main/**'
            dashboard:
              - 'frontend/dashboard/**'
            dash:
              - 'frontend/dash/**'
            landing:
              - 'frontend/landing/**'
            shared:
              - 'frontend/core/**'
              - 'frontend/mock-server/**'
              - 'frontend/e2e/**'
              - 'package.json'
              - 'yarn.lock'
            auth:
              - 'backend/auth/**'
              - 'packages/contracts/**'
              - 'packages/service/**'

  e2e-main:
    name: playwright (main)
    needs: changes
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 30
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.main == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install deps
        run: yarn install --immutable

      - name: Run e2e
        env:
          CI: true
        run: yarn test:e2e:main

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-main
          path: |
            .playwright/report
            .playwright/test-results

  e2e-dashboard:
    name: playwright (dashboard)
    needs: changes
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 30
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.dashboard == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install deps
        run: yarn install --immutable

      - name: Run e2e
        env:
          CI: true
        run: yarn test:e2e:dashboard

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-dashboard
          path: |
            .playwright/report
            .playwright/test-results

  e2e-dash:
    name: playwright (dash)
    needs: changes
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 30
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.dash == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install deps
        run: yarn install --immutable

      - name: Run e2e
        env:
          CI: true
        run: yarn test:e2e:dash

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-dash
          path: |
            .playwright/report
            .playwright/test-results

  e2e-landing:
    name: playwright (landing)
    needs: changes
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 30
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.landing == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install deps
        run: yarn install --immutable

      - name: Run e2e
        env:
          CI: true
        run: yarn test:e2e:landing

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-landing
          path: |
            .playwright/report
            .playwright/test-results

  e2e-auth:
    name: playwright (auth)
    needs: changes
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 30
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.auth == 'true' || needs.changes.outputs.dash == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install deps
        run: yarn install --immutable

      - name: Run auth e2e
        env:
          CI: true
        run: yarn test:e2e:auth --grep "P0"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-auth
          path: |
            .playwright/report
            .playwright/test-results
