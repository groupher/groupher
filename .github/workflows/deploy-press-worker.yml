name: Deploy Press Worker

on:
  workflow_dispatch:
    inputs:
      target:
        description: Cloudflare environment
        required: true
        type: choice
        options:
          - preview
          - production
      confirm_press_cutover:
        description: Confirm production deployment is the planned best-effort Press hard cutover
        required: true
        type: boolean
        default: false
      apply_migrations:
        description: Run the separate analysis migration job before deploying
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-press-worker-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate Press analysis in ${{ inputs.target }}
    if: inputs.apply_migrations
    runs-on: ubuntu-latest
    environment: press-${{ inputs.target }}
    env:
      DATABASE_URL: ${{ secrets.PRESS_MIGRATION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate migration authorization and credential
        env:
          TARGET: ${{ inputs.target }}
          CONFIRM_PRESS_CUTOVER: ${{ inputs.confirm_press_cutover }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          if [ "$TARGET" = "production" ] && [ "$CONFIRM_PRESS_CUTOVER" != "true" ]; then
            echo "Production migration requires explicit Press cutover confirmation." >&2
            exit 1
          fi

      - uses: pnpm/setup@v1
        with:
          install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply analysis migrations
        run: pnpm --filter @groupher/press run db:migrate

  deploy:
    name: Deploy Press and edge-router to ${{ inputs.target }}
    needs: migrate
    if: ${{ always() && !cancelled() && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: press-${{ inputs.target }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PRESS_HYPERDRIVE_ID: ${{ vars.PRESS_HYPERDRIVE_ID }}
      PHOENIX_GRAPHQL_ENDPOINT: ${{ vars.PHOENIX_GRAPHQL_ENDPOINT }}
      PHOENIX_PRESS_RESOURCE: ${{ vars.PHOENIX_PRESS_RESOURCE }}
      SERVICE_AUTH_ISSUER: ${{ vars.SERVICE_AUTH_ISSUER }}
      SERVICE_AUTH_JWKS_URL: ${{ vars.SERVICE_AUTH_JWKS_URL }}
      SERVICE_AUTH_TOKEN_ENDPOINT: ${{ vars.SERVICE_AUTH_TOKEN_ENDPOINT }}
      API_SITE: ${{ vars.API_SITE }}
      PREVIEW_PLATFORM_HOSTS: ${{ vars.PREVIEW_PLATFORM_HOSTS }}
      CUSTOM_DOMAIN_COMMUNITIES: ${{ vars.CUSTOM_DOMAIN_COMMUNITIES }}
      PRESS_PUBLIC_DISABLED: ${{ vars.PRESS_PUBLIC_DISABLED || 'true' }}
      SERVICE_AUTH_CLIENT_ID: ${{ secrets.SERVICE_AUTH_CLIENT_ID }}
      SERVICE_AUTH_CLIENT_SECRET: ${{ secrets.SERVICE_AUTH_CLIENT_SECRET }}
      METRIC_IP_SALT: ${{ secrets.METRIC_IP_SALT }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/setup@v1
        with:
          install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate deployment inputs
        env:
          TARGET: ${{ inputs.target }}
          CONFIRM_PRESS_CUTOVER: ${{ inputs.confirm_press_cutover }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$PRESS_HYPERDRIVE_ID"
          test "$PRESS_HYPERDRIVE_ID" != "00000000-0000-0000-0000-000000000000"
          test -n "$PHOENIX_GRAPHQL_ENDPOINT"
          test -n "$PHOENIX_PRESS_RESOURCE"
          test -n "$SERVICE_AUTH_ISSUER"
          test -n "$SERVICE_AUTH_JWKS_URL"
          test -n "$SERVICE_AUTH_TOKEN_ENDPOINT"
          test -n "$SERVICE_AUTH_CLIENT_ID"
          test -n "$SERVICE_AUTH_CLIENT_SECRET"
          test -n "$METRIC_IP_SALT"
          if [ "$TARGET" = "preview" ]; then
            test -n "$API_SITE"
            test -n "$PREVIEW_PLATFORM_HOSTS"
          elif [ "$CONFIRM_PRESS_CUTOVER" != "true" ]; then
            echo "Production deployment requires explicit Press cutover confirmation." >&2
            exit 1
          fi

      - name: Validate Press and edge-router
        run: |
          set -euo pipefail
          pnpm --filter @groupher/press run type-check
          pnpm --filter @groupher/press run test
          pnpm --filter @groupher/press run build
          pnpm --filter @groupher/edge-router run type-check
          pnpm --filter @groupher/edge-router run test
          pnpm --filter @groupher/edge-router run build

      - name: Create protected Worker secrets file
        env:
          PRESS_SECRETS_FILE: ${{ runner.temp }}/press-worker-secrets.json
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const file = process.env.PRESS_SECRETS_FILE;
            const secrets = {
              SERVICE_AUTH_CLIENT_ID: process.env.SERVICE_AUTH_CLIENT_ID,
              SERVICE_AUTH_CLIENT_SECRET: process.env.SERVICE_AUTH_CLIENT_SECRET,
              METRIC_IP_SALT: process.env.METRIC_IP_SALT,
            };
            writeFileSync(file, JSON.stringify(secrets), { mode: 0o600 });
          '

      - name: Deploy Press Worker
        env:
          TARGET: ${{ inputs.target }}
          PRESS_SECRETS_FILE: ${{ runner.temp }}/press-worker-secrets.json
        run: pnpm --filter @groupher/press exec cf deploy --mode "$TARGET" --secrets-file "$PRESS_SECRETS_FILE"

      - name: Deploy edge-router Service Binding
        env:
          TARGET: ${{ inputs.target }}
        run: pnpm --filter @groupher/edge-router exec cf deploy --mode "$TARGET"

      - name: Remove temporary secret material
        if: always()
        env:
          PRESS_SECRETS_FILE: ${{ runner.temp }}/press-worker-secrets.json
        run: rm -f "$PRESS_SECRETS_FILE"
