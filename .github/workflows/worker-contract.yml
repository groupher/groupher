name: Worker routing contract

on:
  pull_request:
    paths:
      - 'packages/route-contract/**'
      - 'packages/contracts/**'
      - 'infra/edge-router/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    paths:
      - 'packages/route-contract/**'
      - 'packages/contracts/**'
      - 'infra/edge-router/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.target }} ${{ matrix.command }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: route-contract
            workspace: '@groupher/route-contract'
            command: lint
          - target: route-contract
            workspace: '@groupher/route-contract'
            command: type-check
          - target: route-contract
            workspace: '@groupher/route-contract'
            command: test
          - target: edge-router
            workspace: '@groupher/edge-router'
            command: lint
          - target: edge-router
            workspace: '@groupher/edge-router'
            command: type-check
          - target: edge-router
            workspace: '@groupher/edge-router'
            command: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/setup@v1
        with:
          install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run check
        run: pnpm --filter ${{ matrix.workspace }} run ${{ matrix.command }}
