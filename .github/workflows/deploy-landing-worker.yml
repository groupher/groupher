name: Deploy Landing Worker

on:
  pull_request:
    paths:
      - 'frontend/landing/**'
      - 'frontend/core/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches:
      - dev
    paths:
      - 'frontend/landing/**'
      - 'frontend/core/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: deploy-landing-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Landing Worker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type-check
        run: pnpm --filter @groupher/frontend-landing run type-check

      - name: Run lint
        run: pnpm --filter @groupher/frontend-landing run lint

      - name: Validate Worker deploy
        run: pnpm --filter @groupher/frontend-landing run deploy:worker:dry-run

  deploy:
    name: Deploy Landing Worker
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Worker
        run: pnpm --filter @groupher/frontend-landing run deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
