name: Build frontend community

on:
  pull_request:
    paths:
      - 'frontend/community/**'
      - 'frontend/core/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches:
      - dev
    paths:
      - 'frontend/community/**'
      - 'frontend/core/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  build:
    name: Build community
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run build:prod:community
