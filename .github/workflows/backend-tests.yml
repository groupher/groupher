name: Backend unit tests
on:
  push:
    paths:
      - 'backend/api/**'
      - 'backend/auth/**'
      - 'ops/postgres/**'
      - 'packages/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/api/**'
      - 'backend/auth/**'
      - 'ops/postgres/**'
      - 'packages/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/backend-tests.yml'

jobs:
  setup:
    name: Setup environment
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '29.0.6'
          elixir-version: '1.20.4'

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: backend/api/deps
          key: ${{ runner.OS }}-otp29-elixir20-mix-${{ hashFiles('**/mix.lock', '**/mix.exs') }}
          restore-keys: |
            ${{ runner.OS }}-otp29-elixir20-mix-

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: backend/api/_build
          key: ${{ runner.OS }}-otp29-elixir20-build-${{ hashFiles('**/mix.lock', '**/mix.exs') }}
          restore-keys: |
            ${{ runner.OS }}-otp29-elixir20-build-

      - name: Install dependencies
        run: mix deps.get

  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs: setup
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '29.0.6'
          elixir-version: '1.20.4'

      - name: Restore cached deps
        uses: actions/cache@v4
        with:
          path: backend/api/deps
          key: ${{ runner.OS }}-otp29-elixir20-mix-${{ hashFiles('**/mix.lock', '**/mix.exs') }}
          restore-keys: |
            ${{ runner.OS }}-otp29-elixir20-mix-

      - name: Restore cached build
        uses: actions/cache@v4
        with:
          path: backend/api/_build
          key: ${{ runner.OS }}-otp29-elixir20-build-${{ hashFiles('**/mix.lock', '**/mix.exs') }}
          restore-keys: |
            ${{ runner.OS }}-otp29-elixir20-build-

      - name: Ensure dependencies are synced
        run: mix deps.get

      - name: Check backend source style
        run: mix lint.style

      - name: Check Backend context layout
        run: mix lint.context

      - name: Check formatting for changed Elixir files
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          base_sha="$BASE_SHA"
          if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            base_sha="$(git rev-parse "$GITHUB_SHA^")"
          fi
          files="$(git diff --diff-filter=ACMRT --name-only "$base_sha" "$GITHUB_SHA" -- 'backend/api/**/*.ex' 'backend/api/**/*.exs' | sed 's#^backend/api/##')"
          if [ -n "$files" ]; then
            mix format --check-formatted $files
          fi

      - name: Compile without warnings
        run: mix compile --warnings-as-errors

      - name: Check CMS pipeline and Command inventories
        run: |
          mix cms.pipeline.check --check
          mix cms.command.pipeline --check

      - name: Start PostgreSQL with pg_roaringbitmap
        working-directory: ${{ github.workspace }}
        run: |
          docker build -t groupher-postgres:15-roaringbitmap -f ops/postgres/Dockerfile ops/postgres
          docker run --detach --name groupher-postgres --publish 5432:5432 \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_PASSWORD=postgres \
            --env POSTGRES_DB=groupher_server_test \
            groupher-postgres:15-roaringbitmap
          until docker exec groupher-postgres pg_isready -U postgres -d groupher_server_test; do sleep 1; done

      - name: Verify migrations from a fresh database
        run: bash scripts/fresh_db_migrations.sh

      - uses: pnpm/setup@v1
        with:
          install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install JavaScript dependencies for Production Seed tests
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile --filter @groupher/backend-auth... --filter @groupher/content-publisher...

      - name: Run tests
        run: mix test --exclude skip_ci --max-cases 8 --max-failures 1
