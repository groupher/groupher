name: Backend unit tests
on:
  push:
    paths:
      - 'backend/main/**' # only trigger when this dir changes
      - 'ops/postgres/**'
  pull_request:
    paths:
      - 'backend/main/**'
      - 'ops/postgres/**'

jobs:
  setup:
    name: Setup environment
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/main

    steps:
      - uses: actions/checkout@v3

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28.3.3'
          elixir-version: '1.20.3'

      - name: Cache deps
        uses: actions/cache@v3
        with:
          path: backend/main/deps
          key: ${{ runner.OS }}-otp28-elixir20-mix-${{ hashFiles('**/mix.lock', '**/mix.exs') }}
          restore-keys: |
            ${{ runner.OS }}-otp28-elixir20-mix-

      - name: Cache build
        uses: actions/cache@v3
        with:
          path: backend/main/_build
          key: ${{ runner.OS }}-otp28-elixir20-build-${{ hashFiles('**/mix.lock', '**/mix.exs') }}
          restore-keys: |
            ${{ runner.OS }}-otp28-elixir20-build-

      - name: Install dependencies
        run: mix deps.get

  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs: setup
    defaults:
      run:
        working-directory: backend/main
    steps:
      - uses: actions/checkout@v3

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28.3.3'
          elixir-version: '1.20.3'

      - name: Restore cached deps
        uses: actions/cache@v3
        with:
          path: backend/main/deps
          key: ${{ runner.OS }}-otp28-elixir20-mix-${{ hashFiles('**/mix.lock', '**/mix.exs') }}
          restore-keys: |
            ${{ runner.OS }}-otp28-elixir20-mix-

      - name: Restore cached build
        uses: actions/cache@v3
        with:
          path: backend/main/_build
          key: ${{ runner.OS }}-otp28-elixir20-build-${{ hashFiles('**/mix.lock', '**/mix.exs') }}
          restore-keys: |
            ${{ runner.OS }}-otp28-elixir20-build-

      - name: Ensure dependencies are synced
        run: mix deps.get

      - name: Start PostgreSQL with pg_roaringbitmap
        working-directory: ${{ github.workspace }}
        run: |
          docker build -t groupher-postgres:15-roaringbitmap -f ops/postgres/Dockerfile ops/postgres
          docker run --detach --name groupher-postgres --publish 5432:5432 \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_PASSWORD=postgres \
            --env POSTGRES_DB=groupher_server_test \
            groupher-postgres:15-roaringbitmap
          until docker exec groupher-postgres pg_isready -U postgres -d groupher_server_test; do sleep 1; done

      - name: Run tests
        run: mix test --exclude skip_ci --max-cases 8 --max-failures 1
