name: Build frontend main

on:
  pull_request:
    paths:
      - 'frontend/main/**'
      - 'frontend/core/**'
      - 'package.json'
      - 'yarn.lock'
  push:
    paths:
      - 'frontend/main/**' # only trigger when this dir changes
      - 'frontend/core/**'
      - 'package.json'
      - 'yarn.lock'

jobs:
  build:
    name: Build main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: 'groupher/groupher'
          path: './'

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '22.13.0'

      - name: Install Yarn Dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Restore Turbopack build cache
        uses: actions/cache@v4
        with:
          path: frontend/main/.next/cache
          key: ${{ runner.os }}-next-main-${{ hashFiles('yarn.lock', 'frontend/core/**', 'frontend/main/**') }}
          restore-keys: |
            ${{ runner.os }}-next-main-

      # ... (其他步骤，例如 Biome lint)

      - name: Build Project
        run: yarn run build:prod:main
