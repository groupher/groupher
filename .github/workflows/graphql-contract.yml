name: GraphQL schema contract

on:
  pull_request:
    paths:
      - 'backend/api/**'
      - 'backend/auth/src/**'
      - 'backend/import/src/**'
      - 'backend/press/src/**'
      - 'backend/assets-hub/src/**'
      - 'frontend/core/schemas/**'
      - 'frontend/core/schemas/fragments/**'
      - 'frontend/core/unit/**'
      - 'frontend/core/query/**'
      - 'contracts/graphql/**'
      - 'frontend/core/lib/graphql/**'
      - 'frontend/apply/**'
      - 'frontend/community/src/**'
      - 'frontend/dash/src/**'
      - 'frontend/landing/**'
      - 'scripts/report-graphql-complexity.mjs'
      - 'scripts/graphql-complexity-fixtures.mjs'
      - 'codegen.ts'
      - 'Makefile'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/graphql-contract.yml'
  push:
    paths:
      - 'backend/api/**'
      - 'backend/auth/src/**'
      - 'backend/import/src/**'
      - 'backend/press/src/**'
      - 'backend/assets-hub/src/**'
      - 'frontend/core/schemas/**'
      - 'frontend/core/schemas/fragments/**'
      - 'frontend/core/unit/**'
      - 'frontend/core/query/**'
      - 'contracts/graphql/**'
      - 'frontend/core/lib/graphql/**'
      - 'frontend/apply/**'
      - 'frontend/community/src/**'
      - 'frontend/dash/src/**'
      - 'frontend/landing/**'
      - 'scripts/report-graphql-complexity.mjs'
      - 'scripts/graphql-complexity-fixtures.mjs'
      - 'codegen.ts'
      - 'Makefile'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/graphql-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    name: SDL freshness and frontend operations
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/setup@v1
        with:
          install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '29.0.6'
          elixir-version: '1.20.4'

      - name: Install backend dependencies
        working-directory: backend/api
        run: mix deps.get

      - name: Generate the backend SDL and mock-schema link
        run: make be.gen.schema

      - name: Fail when the checked-in SDL is stale
        run: git diff --exit-code -- backend/api/schema.graphql

      - name: Validate repository GraphQL invariants
        run: pnpm run contract:graphql

      - name: Validate Pages operations against the backend SDL
        run: pnpm exec vitest --config frontend/core/vitest.config.mts run frontend/core/schemas/pages/pages.schema.test.ts

      - name: Validate feature-local operations against the backend SDL
        run: pnpm exec vitest --config frontend/core/vitest.config.mts run frontend/core/schemas/feature.schema.test.ts

      - name: Type-check Apply operations against the backend SDL
        run: pnpm --filter @groupher/frontend-apply run type-check

      - name: Generate and verify frontend GraphQL types
        run: |
          pnpm run graphql:codegen
          pnpm run contract:graphql:generated

      - name: Install GraphiQL dependencies for its schema query
        working-directory: backend/api/graphiql
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Check repository operations against Absinthe complexity limit
        run: |
          set -o pipefail
          node scripts/graphql-complexity-fixtures.mjs | (cd backend/api && mix run --no-start test/graphql_complexity/check.exs)

  graphiql:
    name: GraphiQL production asset build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api/graphiql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/api/graphiql/package-lock.json
      - name: Install locked GraphiQL dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Build GraphiQL assets
        run: npm run build
