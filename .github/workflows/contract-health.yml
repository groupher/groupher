name: Contract health

on:
  pull_request:
    paths:
      - 'contracts/services/health/**'
      - 'docs/contract/**'
      - 'docs/sub-apps/health.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    paths:
      - 'contracts/services/health/**'
      - 'docs/contract/**'
      - 'docs/sub-apps/health.md'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  contract-health:
    name: Validate health contract
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Validate health contract
        run: pnpm run contract:health
