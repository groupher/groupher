name: Build frontend landing

on:
  pull_request:
    paths:
      - 'frontend/landing/**'
      - 'frontend/core/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

jobs:
  build:
    name: Build landing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          repository: 'groupher/groupher'
          path: './'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm Dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Restore TanStack build cache
        uses: actions/cache@v4
        with:
          path: frontend/landing/.tanstack
          key: ${{ runner.os }}-tanstack-landing-${{ hashFiles('pnpm-lock.yaml', 'frontend/core/**', 'frontend/landing/**') }}
          restore-keys: |
            ${{ runner.os }}-tanstack-landing-

      - name: Build Project
        run: pnpm run build:prod:landing
