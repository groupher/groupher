name: Build frontend landing

on:
  push:
    paths:
      - 'frontend/landing/**' # only trigger when this dir changes
      - 'frontend/core/**'
      - 'package.json'
      - 'yarn.lock'
  pull_request:
    paths:
      - 'frontend/landing/**'
      - 'frontend/core/**'
      - 'package.json'
      - 'yarn.lock'

jobs:
  build:
    name: Build landing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: 'groupher/groupher'
          path: './'

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '22.13.0'

      - name: Install Yarn Dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Restore Turbopack build cache
        uses: actions/cache@v4
        with:
          path: frontend/landing/.next/cache
          key: ${{ runner.os }}-next-landing-${{ hashFiles('yarn.lock', 'frontend/core/**', 'frontend/landing/**') }}
          restore-keys: |
            ${{ runner.os }}-next-landing-

      - name: Build Project
        run: yarn run build:prod:landing
