name: Dev Hub

on:
  pull_request:
    paths:
      - "local/dev-hub/**"
      - "backend/api/config/linked_checkout_guard.exs"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/dev-hub.yml"
  push:
    paths:
      - "local/dev-hub/**"
      - "backend/api/config/linked_checkout_guard.exs"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/dev-hub.yml"

permissions:
  contents: read

concurrency:
  group: dev-hub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Dev Hub
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '29.1.2'
          elixir-version: '1.20.5'

      - uses: pnpm/setup@v1
        with:
          install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Dev Hub
        run: pnpm --filter @groupher/local-dev-hub run test

      - name: Test isolated database operations
        env:
          GROUPHER_DB_PROVISION_INTEGRATION: '1'
        run: pnpm --filter @groupher/local-dev-hub exec node --import tsx --test src/server/database-create.test.ts src/server/database-read-only.test.ts

      - name: Type-check Dev Hub
        run: pnpm --filter @groupher/local-dev-hub run type-check
