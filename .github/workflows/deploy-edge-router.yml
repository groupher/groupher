name: Deploy Edge Router Worker

on:
  pull_request:
    paths:
      - 'infra/edge-router/**'
      - 'packages/route-contract/**'
      - 'packages/contracts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches:
      - dev
    paths:
      - 'infra/edge-router/**'
      - 'packages/route-contract/**'
      - 'packages/contracts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-edge-router-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Edge Router
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run route contract checks
        run: |
          pnpm --filter @groupher/route-contract run lint
          pnpm --filter @groupher/route-contract run type-check
          pnpm --filter @groupher/route-contract run test

      - name: Run Edge Router checks
        run: |
          pnpm --filter @groupher/edge-router run lint
          pnpm --filter @groupher/edge-router run type-check
          pnpm --filter @groupher/edge-router run test

      - name: Validate Worker deploy
        run: pnpm --filter @groupher/edge-router run deploy:dry-run

  deploy:
    name: Deploy Edge Router Worker
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Worker
        run: pnpm --filter @groupher/edge-router run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
