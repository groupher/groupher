name: Deploy Edge Router Worker

on:
  pull_request:
    paths:
      - 'infra/edge-router/**'
      - 'packages/route-contract/**'
      - 'packages/contracts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches:
      - dev
    paths:
      - 'infra/edge-router/**'
      - 'packages/route-contract/**'
      - 'packages/contracts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      confirm_press_cutover:
        description: Confirm Press has been provisioned and this deployment is the planned hard cutover
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-edge-router-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Edge Router
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/setup@v1
        with:
          install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run route contract checks
        run: |
          pnpm --filter @groupher/route-contract run lint
          pnpm --filter @groupher/route-contract run type-check
          pnpm --filter @groupher/route-contract run test

      - name: Run Edge Router checks
        run: |
          pnpm --filter @groupher/edge-router run lint
          pnpm --filter @groupher/edge-router run type-check
          pnpm --filter @groupher/edge-router run test

      - name: Validate Worker deploy
        run: pnpm --filter @groupher/edge-router run deploy:dry-run

  deploy:
    name: Deploy Edge Router Worker
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_press_cutover == true

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/setup@v1
        with:
          install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Worker
        run: pnpm --filter @groupher/edge-router run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify public Landing assets
        run: node scripts/check-public-landing.mjs
        env:
          PUBLIC_LANDING_ATTEMPTS: '24'
          PUBLIC_LANDING_RETRY_MS: '5000'
