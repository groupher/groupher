name: Deploy Assets Hub Worker

on:
  pull_request:
    paths:
      - 'backend/assets-hub/**'
      - 'package.json'
      - 'yarn.lock'
  push:
    branches:
      - dev
    paths:
      - 'backend/assets-hub/**'
      - 'package.json'
      - 'yarn.lock'

permissions:
  contents: read

concurrency:
  group: deploy-assets-hub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Assets Hub
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install deps
        run: yarn install --immutable

      - name: Run type-check
        run: yarn workspace @groupher/assets-hub type-check

      - name: Run lint
        run: yarn workspace @groupher/assets-hub lint

      - name: Build Node service
        run: yarn workspace @groupher/assets-hub build

      - name: Validate Worker deploy
        run: yarn workspace @groupher/assets-hub deploy:worker:dry-run

  deploy:
    name: Deploy Assets Hub Worker
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install deps
        run: yarn install --immutable

      - name: Deploy Worker
        run: yarn workspace @groupher/assets-hub deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
