name: Build backend Press

on:
  pull_request:
    paths:
      - 'backend/press/**'
      - 'packages/service/**'
      - 'packages/contracts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'Makefile'
  push:
    paths:
      - 'backend/press/**'
      - 'packages/service/**'
      - 'packages/contracts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'Makefile'

jobs:
  build:
    name: Build and test Press
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Drizzle migrations
        run: pnpm --filter @groupher/press exec drizzle-kit check

      - name: Check formatting
        run: pnpm --filter @groupher/press run format:check

      - name: Run lint
        run: pnpm --filter @groupher/press run lint

      - name: Run type-check
        run: pnpm --filter @groupher/press run type-check

      - name: Run unit tests
        run: pnpm --filter @groupher/press run test

      - name: Build
        run: pnpm --filter @groupher/press run build
